# SCAFFOLD ONLY: no account, database, route, cron trigger, or secrets are provisioned.
name = "question-and-form-queue"
main = "worker.mjs"
compatibility_date = "2026-10-15"
workers_dev = true

[vars]
ENABLE_SUBMISSIONS = "false"
ENABLE_QUEUE_SYNC = "false"
EMAIL_COLLECTION_ENABLED = "false"
GITHUB_QUEUE_REPOSITORY = "REPLACE_OWNER/REPLACE_PRIVATE_QUEUE"
ALLOW_LOCAL_TESTING = "false"
LOCAL_ORIGIN = ""

[[d1_databases]]
binding = "DB"
database_name = "question-and-form-requests"
database_id = "REPLACE_WITH_FREE_TIER_D1_DATABASE_ID"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001" # Choose an unused namespace for this account before deployment.
simple = { limit = 10, period = 60 }

# Optional later: [triggers] crons = ["*/15 * * * *"].
# Do not enable until the queue is connected and the account's Free plan is verified.
